name: Post Merge

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'

concurrency: notifications-post-merge

jobs:
  test:
    uses: ./.github/workflows/run-tests.yml

  release:
    needs: test
    name: Release
    permissions:
      contents: write
    uses: govuk-pay/pay-ci/.github/workflows/_create-alpha-release-tag.yml@2f600380181d780f79bc92c3f648a23c6f2ab17d