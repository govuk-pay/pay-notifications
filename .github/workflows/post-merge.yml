name: Post Merge

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'

concurrency: notifications-post-merge

jobs:
  test:
    uses: ./.github/workflows/run-tests.yml

  release:
    needs: test
    name: Release
    permissions:
      contents: write
    uses: govuk-pay/pay-ci/.github/workflows/_create-alpha-release-tag.yml@8597f9957716cb928c22ed66ee0704a24798ce6e