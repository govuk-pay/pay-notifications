name: Post Merge

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'

concurrency: notifications-post-merge

jobs:
  test:
    uses: ./.github/workflows/run-tests.yml

  release:
    needs: test
    name: Release
    permissions:
      contents: write
    uses: govuk-pay/pay-ci/.github/workflows/_create-alpha-release-tag.yml@591ff32de6cd3c9a0f4af2506f8938e7bd5decaa